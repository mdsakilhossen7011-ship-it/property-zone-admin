<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0c"><title>Property Zone · Live Support</title>
<style>
:root{color-scheme:dark;--bg:#090a0c;--panel:#12151a;--line:#292e36;--gold:#d8b45e;--muted:#98a1ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f2eb;font:15px system-ui,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 20px;border-bottom:1px solid var(--line)}.brand{font-weight:800;color:var(--gold);letter-spacing:.08em}.btn{border:1px solid #554629;background:#211b10;color:#f5d98f;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.layout{display:grid;grid-template-columns:320px 1fr;gap:16px;margin-top:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.panel h2{font-size:16px;margin:0;padding:16px;border-bottom:1px solid var(--line)}#chatList{height:70vh;overflow:auto;padding:8px}.person{display:block;width:100%;text-align:left;padding:13px;border:1px solid transparent;border-radius:11px;background:transparent;color:inherit;margin:3px 0;cursor:pointer}.person.active,.person:hover{background:#201b12;border-color:#5b4929}.person strong,.person small{display:block}.person small{color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{display:flex;flex-direction:column;min-height:70vh}.chathead{padding:15px;border-bottom:1px solid var(--line);font-weight:700}.messages{flex:1;min-height:300px;max-height:58vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.bubble{width:fit-content;max-width:82%;padding:9px 13px;border:1px solid var(--line);border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}.user{align-self:flex-start;background:#1b2530}.admin{align-self:flex-end;background:#332817;border-color:#66512c}.bubble small{display:none}.send{display:flex;gap:9px;padding:12px;border-top:1px solid var(--line)}textarea{flex:1;resize:vertical;min-height:44px;max-height:130px;background:#0b0d10;color:white;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}.muted{color:var(--muted);padding:18px;text-align:center}.gate{max-width:390px;margin:12vh auto;padding:24px}.gate h1{color:var(--gold)}input{display:block;width:100%;margin:9px 0 14px;padding:13px;background:#090a0c;border:1px solid var(--line);border-radius:9px;color:white}.status{color:#ffaaa5;min-height:22px;font-size:13px}@media(max-width:700px){.wrap{padding:12px}.layout{grid-template-columns:1fr}.chat{min-height:65vh}#chatList{height:230px}.messages{max-height:48vh;min-height:260px}.brand{font-size:13px}}
</style></head><body>
<div id="gate" class="panel gate"><div class="brand">PROPERTY ZONE · PRIVATE SUPPORT</div><h1>Admin sign in</h1><p class="muted" style="padding:0;text-align:left">Sign in with your authorized administrator account.</p><form id="login"><label>Admin email<input id="email" type="email" value="ridoyhasank5434@gmail.com" readonly></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="btn" id="loginBtn">Secure Login</button><p class="status" id="loginStatus"></p></form></div>
<div id="app" class="wrap" hidden><header class="top"><div class="brand">PROPERTY ZONE · LIVE SUPPORT DESK</div><button class="btn" id="logout">Sign out</button></header><div class="layout"><section class="panel"><h2>Member conversations <span id="count" style="color:var(--muted);font-weight:400"></span></h2><div id="chatList"><div class="muted">Loading conversations…</div></div></section><section class="panel chat"><div class="chathead" id="heading">Select a member to view messages</div><div class="messages" id="messages"><div class="muted">Choose a conversation from the list.</div></div><form class="send" id="sendForm"><textarea id="reply" maxlength="2000" placeholder="Write a reply…" required disabled></textarea><button class="btn" id="sendBtn" disabled>Send</button></form><div class="status" id="chatStatus" style="padding:0 14px 10px"></div></section></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,query,orderBy,onSnapshot,addDoc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDRLWFf4ISfQdoZp7JaQAWwwKCoL_aV6No",authDomain:"property-zone-17121.firebaseapp.com",projectId:"property-zone-17121",storageBucket:"property-zone-17121.firebasestorage.app",messagingSenderId:"631227640032",appId:"1:631227640032:web:855536883072ccfe3b8885"};
const ADMIN_UID="Ry06huUzzmeqryzna9lPzpNw4Rr1",ADMIN_EMAIL="ridoyhasank5434@gmail.com";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);let listOff=null,msgOff=null,activeId=null,chatCache=new Map();
function stopListeners(){if(listOff)listOff();if(msgOff)msgOff();listOff=msgOff=null;}
async function authorize(user){stopListeners();if(!user){$("app").hidden=true;$("gate").hidden=false;return;}try{if(user.uid!==ADMIN_UID||user.email!==ADMIN_EMAIL||!user.emailVerified)throw Error("This account is not authorized.");const snap=await getDoc(doc(db,"admins",user.uid));if(!snap.exists()||snap.data().role!=="admin"||snap.data().active!==true)throw Error("Admin access is inactive.");$("gate").hidden=true;$("app").hidden=false;startInbox();}catch(e){$("app").hidden=true;$("gate").hidden=false;$("loginStatus").textContent=e.message;await signOut(auth);}}
function startInbox(){listOff=onSnapshot(query(collection(db,"supportChats"),orderBy("updatedAt","desc")),snap=>{const box=$("chatList");box.innerHTML="";$("count").textContent="("+snap.size+")";if(snap.empty){box.innerHTML='<div class="muted">No member messages yet.</div>';return;}snap.forEach(d=>{const x=d.data();chatCache.set(d.id,x);const b=document.createElement("button");b.className="person"+(activeId===d.id?" active":"");const n=document.createElement("strong");n.textContent=x.name||x.email||"Member";const p=document.createElement("small");p.textContent=(x.lastMessage||"Conversation started")+" · "+(x.status||"open");b.append(n,p);b.onclick=()=>openChat(d.id,x);box.append(b);});},e=>$("chatList").textContent="Could not load chats: "+e.message);}
function openChat(id,info){activeId=id;$("heading").textContent=(info.name||"Member")+" · "+(info.email||id);$("reply").disabled=false;$("sendBtn").disabled=false;document.querySelectorAll(".person").forEach(b=>b.classList.remove("active"));if(msgOff)msgOff();$("messages").innerHTML='<div class="muted">Loading messages…</div>';msgOff=onSnapshot(query(collection(db,"supportChats",id,"messages"),orderBy("createdAt","asc")),snap=>{const box=$("messages");box.innerHTML="";if(snap.empty)box.innerHTML='<div class="muted">No messages yet. Send the first reply.</div>';snap.forEach(d=>{const m=d.data(),el=document.createElement("div");el.className="bubble "+(m.senderRole==="admin"?"admin":"user");const who=document.createElement("small");who.textContent=m.senderRole==="admin"?"You · Admin":(info.name||"Member");const body=document.createElement("div");body.textContent=m.text||"";const time=document.createElement("small");time.textContent=m.createdAt?.toDate?m.createdAt.toDate().toLocaleString():"";el.append(body);box.append(el);});box.scrollTop=box.scrollHeight;},e=>$("messages").textContent="Could not load messages: "+e.message);}
$("sendForm").addEventListener("submit",async e=>{e.preventDefault();const value=$("reply").value.trim();if(!activeId||!value)return;$("sendBtn").disabled=true;$("chatStatus").textContent="Sending…";try{await addDoc(collection(db,"supportChats",activeId,"messages"),{senderUid:auth.currentUser.uid,senderRole:"admin",text:value,createdAt:serverTimestamp()});await updateDoc(doc(db,"supportChats",activeId),{lastMessage:value,updatedAt:serverTimestamp(),status:"open"});$("reply").value="";$("chatStatus").textContent="";}catch(err){$("chatStatus").textContent="Send failed: "+err.message;}finally{$("sendBtn").disabled=false;}});
$("login").addEventListener("submit",async e=>{e.preventDefault();$("loginBtn").disabled=true;$("loginStatus").textContent="Signing in…";try{await signInWithEmailAndPassword(auth,ADMIN_EMAIL,$("password").value);}catch(err){$("loginStatus").textContent=err.message;}finally{$("loginBtn").disabled=false;}});
$("logout").onclick=()=>signOut(auth);onAuthStateChanged(auth,authorize);
</script></body></html>
